name: Snap Hutao Alpha
on:
  workflow_dispatch:
  push:
    branches: [ develop ]
    paths-ignore:
      - '.gitattributes'
      - '.github/**'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - '**.yml'
  pull_request:
    branches: [ develop ]
    paths-ignore:
      - '.gitattributes'
      - '.github/**'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - '**.yml'
      - '**.resx'

jobs:
  select-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.select_runner.outputs.runner }}
    steps:
      - name: Select runner
        id: select_runner
        shell: bash
        env:
          ORG:  ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          LABEL: ${{ vars.RUNNER_LABEL || 'sjc1' }}
        run: |
          set -o pipefail
          FALLBACK="windows-latest"

          get_status_by_label () {
            local url="$1"
            local json
            json=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $TOKEN" \
              "$url" 2>/dev/null || true)
            jq -r --arg label "$LABEL" '
              (.runners // [])
              | map(select(any(.labels[]?; .name==$label)))
              | .[0].status // ""' <<<"$json" 2>/dev/null || echo ""
          }

          # Check org's runner first and then repo's
          STATUS="$(get_status_by_label "https://api.github.com/orgs/${ORG}/actions/runners?per_page=100")"
          if [ -z "$STATUS" ]; then
            STATUS="$(get_status_by_label "https://api.github.com/repos/${REPO}/actions/runners?per_page=100")"
          fi

          if [ "$STATUS" = "online" ]; then
            PICK="$LABEL"
          else
            PICK="$FALLBACK"
          fi

          echo "Selected runner: $PICK (label=$LABEL, status=${STATUS:-unknown})"
          echo "runner=$PICK" >> "$GITHUB_OUTPUT"
  build:
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET (self-hosted)
        if: ${{ needs.select-runner.outputs.runner == 'sjc1' }}
        shell: pwsh
        run: |
          Write-Host "Running environment setup script…"
          Invoke-WebRequest `
            -Uri 'https://raw.githubusercontent.com/DGP-Studio/Snap.Hutao.DevelopEnvironment.Setup/refs/heads/main/setup.ps1' `
            -OutFile 'setup.ps1' `
            -UseBasicParsing
          Write-Host "Executing setup.ps1"
          .\setup.ps1

      - name: Setup .NET
        if: ${{ needs.select-runner.outputs.runner == 'windows-latest' }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0

      - name: Cache NuGet packages
        if: ${{ needs.select-runner.outputs.runner == 'windows-latest' }}
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Snap.Hutao.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cake
        id: cake
        shell: pwsh
        run: dotnet tool restore && dotnet cake
        env:
          VERSION_API_TOKEN: ${{ secrets.VERSION_API_TOKEN }}
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
          PW: ${{ secrets.PW }}

      - name: Setup AWS CLI (self-hosted)
        if: success() && github.event_name != 'pull_request' && needs.select-runner.outputs.runner == 'sjc1'
        shell: pwsh
        run: |
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
            Write-Host "Installing AWS CLI..."
            Invoke-WebRequest -Uri "https://awscli.amazonaws.com/AWSCLIV2.msi" -OutFile "AWSCLIV2.msi"
            Start-Process msiexec.exe -Wait -ArgumentList '/i AWSCLIV2.msi /quiet'
            $awsPath = "C:\Program Files\Amazon\AWSCLIV2"
            echo $awsPath >> $env:GITHUB_PATH
            Write-Host "AWS CLI installed."
          } else {
            Write-Host "AWS CLI already installed."
          }

      - name: Upload to Cloudflare R2
        if: success() && github.event_name != 'pull_request'
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          $version = "${{ steps.cake.outputs.version }}"
          $srcPath = "${{ github.workspace }}/src/output/Snap.Hutao.Alpha-$version.msix"
          
          Write-Host "Uploading $srcPath to Cloudflare R2 as Snap.Hutao.Alpha.msix..."
          aws s3 cp $srcPath s3://snap-hutao-alpha/Snap.Hutao.Alpha.msix `
            --endpoint-url $env:R2_ENDPOINT_URL
          
          Write-Host "Upload complete."

      - name: Add summary
        if: success() && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $summary = "
          > [!WARNING]
          > 该版本是由 CI 程序自动打包生成的 `Alpha` 测试版本，包含已经基本完工的新功能及问题修复

          > [!IMPORTANT]
          > 请先安装 **[DGP_Studio_CA.crt](https://github.com/DGP-Automation/Hutao-Auto-Release/releases/download/certificate-ca/DGP_Studio_CA.crt)** 到 **受信任的根证书颁发机构** 以安装测试版安装包
          "
          echo $summary >> $Env:GITHUB_STEP_SUMMARY

      - name: Clean up
        shell: pwsh
        run: |
          Write-Host "Cleaning up NuGet cache..."
          Remove-Item -Recurse -Force "$env:USERPROFILE\.nuget\packages"
          Write-Host "NuGet cache cleaned."
